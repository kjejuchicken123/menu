<style>
/* Layout: an orange brand band like the printed menu cover, a sticky category rail, then photo rows grouped by category */
:root{
  --bg:#fbf5ec; --paper:#fffaf3; --ink:#2a1a10; --muted:#7a6352; --line:#ecdcc8;
  --brand:#ee5a1c; --brand-ink:#fff; --brand-soft:#fde3d2; --price:#c2410c; --chip:#f6e8d8;
  --display:"Be Vietnam Pro","Noto Sans KR",system-ui,sans-serif;
  --body:"Be Vietnam Pro","Noto Sans KR",system-ui,sans-serif;
  --kr:"Noto Sans KR","Be Vietnam Pro",system-ui,sans-serif;
  --kr-display:"Black Han Sans","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b120c; --paper:#25190f; --ink:#f7ebdd; --muted:#c0a58e; --line:#3a2a1d;
  --brand:#f06a2c; --brand-ink:#fff; --brand-soft:#4a2512; --price:#ff9a5c; --chip:#33231a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b120c; --paper:#25190f; --ink:#f7ebdd; --muted:#c0a58e; --line:#3a2a1d;
  --brand:#f06a2c; --brand-ink:#fff; --brand-soft:#4a2512; --price:#ff9a5c; --chip:#33231a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--brand);color:var(--brand-ink)}
header .wrap{padding-block:22px 20px;display:grid;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font:800 clamp(28px,7vw,40px)/1.05 var(--display);letter-spacing:-.01em;text-wrap:balance}
.brand .kr{font:400 clamp(18px,4.6vw,22px)/1.2 var(--kr-display);opacity:.92;margin-top:4px;letter-spacing:.02em}
.lang{display:flex;background:rgba(0,0,0,.18);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:inherit;font:600 13px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer;min-width:44px}
.lang button[aria-pressed="true"]{background:#fff;color:#c2410c}
.lang button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.info{display:grid;gap:4px;font-size:14px}
.info b{font-weight:600}
.info .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.copy{border:1px solid rgba(255,255,255,.6);background:transparent;color:inherit;border-radius:999px;padding:2px 10px;font:500 12px var(--body);cursor:pointer}
.copy:focus-visible{outline:2px solid #fff;outline-offset:2px}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.rail .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
nav.rail .wrap::-webkit-scrollbar{display:none}
nav.rail a{flex:none;text-decoration:none;color:var(--ink);background:var(--chip);padding:7px 14px;border-radius:999px;font:500 14px var(--body);white-space:nowrap}
nav.rail a.on{background:var(--brand);color:var(--brand-ink)}
nav.rail a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main .wrap{padding-block:8px 32px;display:grid;gap:28px}
section{scroll-margin-top:64px}
section h2{margin:18px 0 2px;font:800 22px/1.2 var(--display);text-wrap:balance}
section h2 small{display:block;font:500 13px var(--kr);color:var(--muted);margin-top:2px;letter-spacing:.02em}
.note{margin:6px 0 0;font-size:13px;color:var(--price);font-weight:500}
.list{display:grid;margin-top:10px;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item.noimg{grid-template-columns:1fr auto;padding-left:88px}
.item img{width:76px;height:76px;object-fit:cover;border-radius:12px;background:var(--chip)}
.item .t{min-width:0}
.item .n{font:600 16px/1.3 var(--body)}
.item .s{font:400 13px/1.35 var(--kr);color:var(--muted)}
.item .d{font-size:13px;color:var(--muted);margin-top:2px}
.price{font:700 16px var(--body);color:var(--price);font-variant-numeric:tabular-nums;white-space:nowrap}
.combos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.combo{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid}
.combo img{width:100%;aspect-ratio:1/1;object-fit:cover;max-width:100%}
.combo .t{padding:10px 12px 12px;display:grid;gap:4px}
.combo .n{font:800 18px var(--display);color:var(--price)}
.combo .d{font-size:13px;line-height:1.4}
.juices{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;margin-top:12px}
.juice{display:grid;gap:4px;text-align:center}
.juice img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;max-width:100%}
.juice .n{font-weight:600}
.juice .s{font:12px var(--kr);color:var(--muted)}
.juice .price{font-size:14px}
.extras{background:var(--brand-soft);border-radius:16px;padding:14px 16px;display:grid;gap:6px;font-size:14px}
.extras h3{margin:0 0 2px;font:800 16px var(--display)}
.extras ul{margin:0;padding-left:18px;display:grid;gap:4px}
footer .wrap{padding-block:8px 36px;color:var(--muted);font-size:13px;display:grid;gap:4px}
@media (max-width:420px){
  .item{grid-template-columns:64px 1fr auto}.item img{width:64px;height:64px}.item.noimg{padding-left:76px}
  .combos{gap:10px}.combo .n{font-size:16px}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=T[e.dataset.i][k]});
  const rail=document.getElementById("rail"),menu=document.getElementById("menu");
  rail.innerHTML="";menu.innerHTML="";
  DATA.forEach((c,ci)=>{
    const a=document.createElement("a");a.href="#"+c.id;a.textContent=c.n[k];a.dataset.c=c.id;rail.append(a);
    const s=document.createElement("section");s.id=c.id;
    const second=c.n[sec()]!==c.n[k]?c.n[sec()]:"";
    s.innerHTML=`<h2>${c.n[k]}${second?`<small>${second}</small>`:""}</h2>`+(c.note?`<p class="note">${c.note[k]}</p>`:"");
    let box;
    if(c.id==="combo"){box=document.createElement("div");box.className="combos";
      c.items.forEach(it=>{box.insertAdjacentHTML("beforeend",`<article class="combo"><img src="${IMGS[it.img]}" alt="${it.n[k]}" loading="lazy"><div class="t"><div class="n">${fmt(it.p)}</div><div class="d">${it.d[k]}</div></div></article>`)});}
    else if(c.id==="juice"){box=document.createElement("div");box.className="juices";
      c.items.forEach(it=>{box.insertAdjacentHTML("beforeend",`<div class="juice"><img src="${IMGS[it.img]}" alt="${it.n[k]}" loading="lazy"><div class="n">${it.n[k]}</div><div class="s">${it.n[sec()]}</div><div class="price">${fmt(it.p)}</div></div>`)});}
    else{box=document.createElement("div");box.className="list";
      c.items.forEach(it=>{const s2=it.n[sec()]!==it.n[k]?it.n[sec()]:"";
        box.insertAdjacentHTML("beforeend",`<div class="item${it.img?"":" noimg"}">${it.img?`<img src="${IMGS[it.img]}" alt="" loading="lazy">`:""}<div class="t"><div class="n">${it.n[k]}</div>${s2?`<div class="s">${s2}</div>`:""}${it.d?`<div class="d">${it.d[k]}</div>`:""}</div><div class="price">${fmt(it.p)}</div></div>`)});}
    s.append(box);menu.append(s);
    if(c.id==="halfhalf"){}
  });
  const ex=document.createElement("div");ex.className="extras";
  ex.innerHTML=`<h3>${T.extrasH[k]}</h3><ul>${T.extras[k].map(x=>`<li>${x}</li>`).join("")}</ul>`;
  menu.insertBefore(ex,document.getElementById("chicken"));
  observe();
}
let io;
function observe(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
    document.querySelectorAll("nav.rail a").forEach(a=>{const on=a.dataset.c===e.target.id;a.classList.toggle("on",on);if(on)a.scrollIntoView({block:"nearest",inline:"center"})})}})},{rootMargin:"-30% 0px -65% 0px"});
  document.querySelectorAll("main section").forEach(s=>io.observe(s));
}
document.querySelectorAll("[data-l]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l;try{localStorage.setItem("kj-lang",lang)}catch(e){}render()}));
document.getElementById("copyPhone").addEventListener("click",e=>{
  const b=e.currentTarget,k=L[lang];
  navigator.clipboard.writeText("0896615574").then(()=>{b.textContent=T.copied[k];setTimeout(()=>b.textContent=T.copy[k],1500)})
  .catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("phone"));const s=getSelection();s.removeAllRanges();s.addRange(r)});
});
render();
</script>
